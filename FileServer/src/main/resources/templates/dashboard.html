<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container py-3">

    <div class="d-flex justify-content-between align-items-center mb-2">

        <h2>File Dashboard</h2>

        <div>

            <a
                    href="/fileserver/activities-page"
                    class="btn btn-secondary">

                Activities

            </a>

            <a
                    href="/fileserver/shared-files-page"
                    class="btn btn-info">

                Shared Files

            </a>

            <button
                    class="btn btn-danger"
                    onclick="logout()">

                Logout

            </button>

        </div>

    </div>

    <hr>

    <form id="uploadForm" class="mb-4">

        <input
                type="file"
                id="fileInput"
                class="form-control mb-3"
                required>

        <button
                type="submit"
                class="btn btn-primary">

            Upload File

        </button>

    </form>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Sr No.</th>

            <th>File Name</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody id="fileTableBody">

        </tbody>

    </table>

</div>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080">

    <div id="statusToast"
         class="toast"
         role="alert">

        <div class="toast-header">

            <strong
                    class="me-auto"
                    id="toastTitle">

                Status

            </strong>

            <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="toast">

            </button>

        </div>

        <div
                class="toast-body"
                id="toastBody">

        </div>

    </div>

</div>

<!-- Share Modal -->

<div
        class="modal fade"
        id="shareModal"
        tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Share File

                </h5>

                <button
                        class="btn-close"
                        data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <input
                        type="text"
                        id="shareUsername"
                        class="form-control"
                        placeholder="Enter Username">

            </div>

            <div class="modal-footer">

                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                        class="btn btn-primary"
                        onclick="shareFile()">

                    Share

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const token = localStorage.getItem("token");

    if(!token){

        window.location.href="/fileserver/login-page";

    }

    let selectedFileId=null;

    function showToast(title,message){

        const el=document.getElementById("statusToast");

        document.getElementById("toastTitle").textContent=title;

        document.getElementById("toastBody").textContent=message;

        bootstrap.Toast.getOrCreateInstance(el,{delay:2500}).show();

    }

    async function loadFiles(){

        const response=await fetch(

            "/fileserver/file/my-files",

            {

                headers:{

                    Authorization:`Bearer ${token}`

                }

            }

        );

        if(!response.ok){

            showToast("Error","Unable to load files");

            return;

        }

        const files=await response.json();

        const tableBody=document.getElementById("fileTableBody");

        tableBody.innerHTML="";

        if(files.length===0){

            tableBody.innerHTML=`
            <tr>
                <td colspan="3"
                    class="text-center">
                    No Files Uploaded
                </td>
            </tr>`;

            return;

        }

        files.forEach((file,index)=>{

            tableBody.innerHTML+=`

            <tr>

                <td>${index+1}</td>

                <td>${file.fileName}</td>

                <td>

                    <button
                        class="btn btn-success btn-sm"
                        onclick="downloadFile(${file.id})">

                        Download

                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="deleteFile(${file.id})">

                        Delete

                    </button>

                    <button
                        class="btn btn-warning btn-sm"
                        onclick="openShareModal(${file.id})">

                        Share

                    </button>

                </td>

            </tr>

            `;

        });

    }
    document.getElementById("uploadForm")
.addEventListener("submit", async function (e) {

    e.preventDefault();

    const file =
        document.getElementById("fileInput").files[0];

    const formData = new FormData();

    formData.append("file", file);

    try {

        const response = await fetch(

            "/fileserver/file/upload",

            {

                method: "POST",

                headers: {

                    Authorization: `Bearer ${token}`

                },

                body: formData

            }

        );

        const message = await response.text();

        if (!response.ok) {

            showToast("Upload Failed", message);

            return;

        }

        showToast("Success", message);

        document.getElementById("fileInput").value = "";

        loadFiles();

    } catch (e) {

        showToast("Error", "Server Error");

    }

});

async function deleteFile(id) {

    try {

        const response = await fetch(

            `/fileserver/file/delete/${id}`,

            {

                method: "DELETE",

                headers: {

                    Authorization: `Bearer ${token}`

                }

            }

        );

        const message = await response.text();

        if (!response.ok) {

            showToast("Delete Failed", message);

            return;

        }

        showToast("Success", message);

        loadFiles();

    } catch (e) {

        showToast("Error", "Server Error");

    }

}

async function downloadFile(id) {

    try {

        const response = await fetch(

            `/fileserver/file/download/${id}`,

            {

                headers: {

                    Authorization: `Bearer ${token}`

                }

            }

        );

        if (!response.ok) {

            const message = await response.text();

            showToast("Download Failed", message);

            return;

        }

        const blob = await response.blob();

        const cd =
            response.headers.get("Content-Disposition") || "";

        let filename = "download";

        const match = cd.match(/filename="([^"]+)"/);

        if (match) {

            filename = match[1];

        }

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;

        a.download = filename;

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);

        showToast("Success", "File Downloaded");

    } catch (e) {

        showToast("Error", "Server Error");

    }

}

function openShareModal(fileId) {

    selectedFileId = fileId;

    document.getElementById("shareUsername").value = "";

    const modal = new bootstrap.Modal(

        document.getElementById("shareModal")

    );

    modal.show();

}

async function shareFile() {

    const username =
        document.getElementById("shareUsername").value.trim();

    if (username === "") {

        showToast("Error", "Enter Username");

        return;

    }

    try {

        const response = await fetch(

            `/fileserver/shared-file/share/${selectedFileId}`,

            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json",

                    Authorization: `Bearer ${token}`

                },

                body: JSON.stringify({

                    username: username

                })

            }

        );

        const message = await response.text();

        if (!response.ok) {

            showToast("Share Failed", message);

            return;

        }

        showToast("Success", message);

        bootstrap.Modal
            .getInstance(
                document.getElementById("shareModal")
            )
            .hide();

    } catch (e) {

        showToast("Error", "Server Error");

    }

}

function logout() {

    localStorage.removeItem("token");

    window.location.href =
        "/fileserver/login-page";

}

loadFiles();

</script>

</body>

</html>
