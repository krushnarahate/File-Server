<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Admin Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between">

        <h2>
            Admin Dashboard
        </h2>

        <button
                class="btn btn-danger"
                onclick="logout()">

            Logout

        </button>

    </div>

    <hr>

    <h3 class="mb-3">
        Users
    </h3>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>

            <th>Username</th>

            <th>Role</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody id="userTableBody">

        </tbody>

    </table>

    <hr>

    <h3 class="mb-3">
        Activities
    </h3>

    <div class="d-flex gap-2 mb-3">
        <input
                id="activityUsernameSearch"
                type="text"
                class="form-control"
                placeholder="Search by username">

        <button
                id="activitySearchBtn"
                type="button"
                class="btn btn-outline-primary">
            Search
        </button>
    </div>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>

            <th>Username</th>

            <th>Action</th>

            <th>File</th>

            <th>Time</th>

        </tr>

        </thead>

        <tbody id="activityTableBody">

        </tbody>

    </table>

</div>

<script>

    const token =
        localStorage.getItem("token");

    const role = localStorage.getItem("role");

if (!token) {
    window.location.href = "/fileserver/login-page";
}

if (role !== "ADMIN" && role !== "ROLE_ADMIN") {
    alert("Access Denied");
    window.location.href = "/fileserver/dashboard-page";
}

    if(!token) {

        window.location.href =
            "/fileserver/login-page";
    }

    function handleAuthFailure(response) {
        if (response.status === 401 || response.status === 403) {
            alert("Access Denied");
            window.location.href = "/fileserver/dashboard-page";
            return true;
        }
        return false;
    }

    let allActivities = [];

    function renderActivities(filterUsername) {
        const tableBody =
            document.getElementById(
                "activityTableBody"
            );

        const q = (filterUsername ?? "").trim().toLowerCase();
        const rows = q
            ? allActivities.filter(a => (a.username ?? "").toLowerCase().includes(q))
            : allActivities;

        tableBody.innerHTML = "";

        rows.forEach(activity => {

            tableBody.innerHTML += `

                <tr>

                    <td>${activity.id}</td>

                    <td>${activity.username}</td>

                    <td>${activity.action}</td>

                    <td>${activity.fileName ?? "-"}</td>

                    <td>${activity.time}</td>

                </tr>
            `;
        });
    }

    async function loadUsers() {

        const response = await fetch(
            "/fileserver/admin/all-users",
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

        if (handleAuthFailure(response)) {
            return;
        }

        const users = await response.json();

        const tableBody =
            document.getElementById(
                "userTableBody"
            );

        tableBody.innerHTML = "";

        users.forEach((user, idx) => {

            const userId = user.userId ?? user.id;
            const roleRaw = (user.role ?? "").toString().trim();
            const roleNorm = roleRaw.toUpperCase();
            const isAdminRole = roleNorm === "ADMIN" || roleNorm === "ROLE_ADMIN";

            tableBody.innerHTML += `

                <tr>

                    <td>${idx + 1}</td>

                    <td>${user.username}</td>

                    <td>${user.role}</td>

                    <td>

                        ${
                            isAdminRole
                                ? ""
                                : `
                        <button
                            class="btn btn-success btn-sm"
                            onclick="makeAdmin(${userId})">

                            Make Admin

                        </button>
                        `
                        }

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteUser(${userId})">

                            Delete

                        </button>

                    </td>

                </tr>
            `;
        });
    }

    async function loadActivities() {

        const response = await fetch(
            "/fileserver/admin/all-activities",
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

        if (handleAuthFailure(response)) {
            return;
        }

        const activities =
            await response.json();

        allActivities = Array.isArray(activities) ? activities : [];
        renderActivities(document.getElementById("activityUsernameSearch")?.value);
    }

    async function deleteUser(id) {

        const response = await fetch(
            `/fileserver/admin/delete-user/${id}`,
            {
                method: "DELETE",

                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

        if (handleAuthFailure(response)) {
            return;
        }

        loadUsers();
    }

    async function makeAdmin(id) {

        const response = await fetch(
            `/fileserver/admin/create-admin/${id}`,
            {
                method: "PUT",

                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

        if (handleAuthFailure(response)) {
            return;
        }

        loadUsers();
    }

    loadUsers();

    loadActivities();

    document.getElementById("activitySearchBtn")?.addEventListener("click", () => {
        renderActivities(document.getElementById("activityUsernameSearch")?.value);
    });

    document.getElementById("activityUsernameSearch")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            renderActivities(document.getElementById("activityUsernameSearch")?.value);
        }
    });

    function logout() {

    localStorage.removeItem("token");

    window.location.href = "/fileserver/login-page";
}

</script>

</body>
</html>
