<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Activities</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between">

        <h2>
            My Activities
        </h2>

        <a
                href="/fileserver/dashboard-page"
                class="btn btn-primary">

            Dashboard

        </a>

    </div>

    <hr>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Sr no.</th>

            <th>Action</th>

            <th>File Name</th>

            <th>Time</th>

        </tr>

        </thead>

        <tbody id="activityTableBody">

        </tbody>

    </table>

</div>

<script>

    const token =
        localStorage.getItem("token");

    if(!token) {

        window.location.href =
            "/fileserver/login-page";
    }

    async function loadActivities() {

        const response = await fetch(
            "/fileserver/activity/my-activities",
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

        const activities =
            await response.json();

        const tableBody =
            document.getElementById(
                "activityTableBody"
            );

        tableBody.innerHTML = "";

        activities.forEach((activity, idx) => {

            tableBody.innerHTML += `

                <tr>

                    <td>${idx + 1}</td>

                    <td>${activity.action}</td>

                    <td>${activity.fileName ?? "-"}</td>

                    <td>${activity.time}</td>

                </tr>
            `;
        });
    }

    loadActivities();

</script>

</body>
</html>
