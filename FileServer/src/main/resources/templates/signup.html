<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Signup</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <h2 class="mb-4 text-center">
                Create Account
            </h2>

            <form id="signupForm">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                            type="text"
                            id="username"
                            class="form-control"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            class="form-control"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password"
                            class="form-control"
                            required>

                </div>

                <button
                        type="submit"
                        class="btn btn-success w-100">

                    Signup

                </button>

            </form>

            <p class="mt-3 text-center">

                Already have account?

                <a href="/fileserver/login-page">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

<script>

    document
        .getElementById("signupForm")
        .addEventListener("submit", async function (e) {

            e.preventDefault();

            const username =
                document.getElementById("username").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            try {

                const response = await fetch(
                    // server.servlet.context-path=/fileserver and AuthController maps /auth/register
                    "/fileserver/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            email,
                            password
                        })
                    }
                );

                if(response.ok) {

                    alert("Signup Successful");

                    window.location.href =
                        "/fileserver/login-page";
                }
                else {

                    const error =
                        await response.text();

                    // Backend may return plain text or JSON; show something either way.
                    alert(error || "Signup failed");
                }

            } catch (error) {

                alert("Server Error");
            }
        });

</script>

</body>
</html>
