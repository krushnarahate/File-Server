<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Shared Files</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center">

        <h2>Shared Files</h2>

        <div>

            <a
                    href="/fileserver/dashboard-page"
                    class="btn btn-primary">

                Dashboard

            </a>

            <button
                    class="btn btn-danger"
                    onclick="logout()">

                Logout

            </button>

        </div>

    </div>

    <hr>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Sr No.</th>

            <th>File Name</th>

            <th>Shared By</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody id="sharedFileTable">

        </tbody>

    </table>

</div>

<div class="toast-container position-fixed top-0 end-0 p-3">

    <div
            id="statusToast"
            class="toast">

        <div class="toast-header">

            <strong
                    id="toastTitle"
                    class="me-auto">

                Status

            </strong>

            <button
                    class="btn-close"
                    data-bs-dismiss="toast">

            </button>

        </div>

        <div
                id="toastBody"
                class="toast-body">

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const token = localStorage.getItem("token");

    if(!token){

        window.location.href="/fileserver/login-page";

    }

    function showToast(title,message){

        document.getElementById("toastTitle").textContent=title;

        document.getElementById("toastBody").textContent=message;

        bootstrap.Toast
            .getOrCreateInstance(
                document.getElementById("statusToast")
            )
            .show();

    }

    async function loadSharedFiles(){

        try{

            const response=await fetch(

                "/fileserver/shared-file/shared-files",

                {

                    headers:{

                        Authorization:`Bearer ${token}`

                    }

                }

            );

            if(!response.ok){

                showToast("Error","Unable to load shared files");

                return;

            }

            const files=await response.json();

            const table=document.getElementById("sharedFileTable");

            table.innerHTML="";

            if(files.length===0){

                table.innerHTML=`

                <tr>

                    <td colspan="4"

                        class="text-center">

                        No Shared Files

                    </td>

                </tr>

                `;

                return;

            }

            files.forEach((file,index)=>{

                table.innerHTML+=`

                <tr>

                    <td>${index+1}</td>

                    <td>${file.fileName}</td>

                    <td>${file.owner}</td>

                    <td>

                        <button

                            class="btn btn-success btn-sm"

                            onclick="downloadSharedFile(${file.id})">

                            Download

                        </button>

                    </td>

                </tr>

                `;

            });

        }

        catch(e){

            showToast("Error","Server Error");

        }

    }

    async function downloadSharedFile(id){

        try{

            const response=await fetch(

                `/fileserver/shared-file/download/${id}`,

                {

                    headers:{

                        Authorization:`Bearer ${token}`

                    }

                }

            );

            if(!response.ok){

                const message=await response.text();

                showToast("Error",message);

                return;

            }

            const blob=await response.blob();

            const cd=response.headers.get("Content-Disposition")||"";

            let filename="download";

            const match=cd.match(/filename="([^"]+)"/);

            if(match){

                filename=match[1];

            }

            const url=URL.createObjectURL(blob);

            const a=document.createElement("a");

            a.href=url;

            a.download=filename;

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

            showToast("Success","File Downloaded");

        }

        catch(e){

            showToast("Error","Server Error");

        }

    }

    function logout(){

        localStorage.removeItem("token");

        window.location.href="/fileserver/login-page";

    }

    loadSharedFiles();

</script>

</body>

</html>
